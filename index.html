<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>To-Do</title>
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="To-Do">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="topbar">
    <button id="syncBtn" class="sync" aria-label="Sync-Status" hidden></button>
    <button id="menuBtn" class="circle-btn" aria-label="Mehr">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </button>
  </div>
  <h1 id="title" class="large-title"></h1>
</header>

<nav class="nav-sticky">
  <div id="spaces" class="chips" aria-label="Bereiche"></div>
  <div id="pages" class="chips sub" aria-label="Unterseiten"></div>
</nav>

<main id="list" class="list"></main>

<footer id="addbar" class="addbar">
  <div id="addHint" class="add-hint" hidden></div>
  <form id="addForm" class="add-form" autocomplete="off">
    <div class="field">
      <input id="addInput" type="text" placeholder="Neue Erinnerung" enterkeyhint="done" aria-label="Neue Erinnerung">
      <button type="button" id="micBtn" class="field-mic" aria-label="Diktieren"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11.5" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></button>
      <button type="submit" id="sendBtn" class="field-send" aria-label="Hinzufügen" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
    </div>
  </form>
</footer>

<button id="fab" class="fab" aria-label="Aufgabe diktieren" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11.5" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
</button>

<div id="toast" class="toast" role="status" hidden></div>

<div id="voice" class="voice" role="dialog" aria-modal="true" aria-label="Diktieren" hidden></div>

<div id="sheetWrap" class="sheet-wrap" hidden>
  <div class="backdrop" data-close></div>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true"></div>
</div>

<script src="parser.js"></script>
<script src="app.js"></script>
<script src="voice.js"></script>
</body>
</html>
